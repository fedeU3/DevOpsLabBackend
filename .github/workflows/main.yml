name: CI - Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, preproduccion, produccion]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint_and_sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # recomendado para Sonar (historia/PR decoration)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint (fails on errors)
        run: npm run lint

      # (Opcional recomendado) tests si ya existen
      # - name: Test
      #   run: npm test -- --ci

      - name: SonarCloud Scan (Quality Gate enforced)
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # Ejemplo de “endurecer” SOLO en preproduccion/produccion:
      # (esto no cambia el Gate de Sonar, pero te deja agregar checks extra)
      - name: Extra checks for preproduccion/produccion (example)
        if: github.ref == 'refs/heads/preproduccion' || github.ref == 'refs/heads/produccion'
        run: |
          echo "Aquí podrías exigir cosas extra (por ejemplo, npm run format:check o tests obligatorios)."
